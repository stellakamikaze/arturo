# Sonda temporanea #6623: SP02 di test_parole_veloci su Windows, base 663bcba contro dev, da solo e sotto carico.
# Solo sul ramo sonda-6623, da togliere a diagnosi chiusa.
name: sonda-6623
on:
  push:
    branches: [sonda-6623]
permissions:
  contents: read
jobs:
  sonda:
    if: github.repository == 'stellakamikaze/arturo'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Git senza conversione degli a capo
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Base 663bcba
        run: git worktree add --detach ../base 663bcba
      - name: Tempi del comando triplo, base e dev
        run: |
          python .github/sonda-6623/sonda.py ../base 2 base-solo
          python .github/sonda-6623/sonda.py . 4 dev-solo
      - name: Il test vero, quattro giri insieme come i worker del gate
        run: |
          bash .github/sonda-6623/giri.sh ../base 10 base-a --baseline-ref 663bcba > a.log 2>&1 &
          bash .github/sonda-6623/giri.sh ../base 10 base-b --baseline-ref 663bcba > b.log 2>&1 &
          bash .github/sonda-6623/giri.sh . 10 dev-c > c.log 2>&1 &
          bash .github/sonda-6623/giri.sh . 10 dev-d > d.log 2>&1 &
          wait
          cat a.log b.log c.log d.log
          echo "=== SINTESI"
          echo "base discriminante: $(cat a.log b.log | grep -c 'BASELINE_DISCRIMINANTE=SP01,SP02') su 20"
          echo "dev verde: $(cat c.log d.log | grep -c ' rc=0 .*PASS SP01') su 20"
