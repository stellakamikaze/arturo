# Landing di Arturo dietro parola d'ordine.
# /entra e /font/ sono pubblici, tutto il resto chiede il cookie firmato.
js_path   /etc/nginx/njs/;
js_import gate from gate.js;
include   /etc/nginx/segreti/gate.conf;   # js_var $gate_hash ...; js_var $gate_chiave ...;
js_set    $ammesso gate.ammesso;

# Dietro il tunnel l'indirizzo vero sta in CF-Connecting-IP.
map $http_cf_connecting_ip $chi_tenta {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $chi_tenta zone=entra:1m rate=10r/m;

server {
    listen      80;
    listen      [::]:80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;
    absolute_redirect off;   # dietro il tunnel lo schema giusto è https: redirect relativi

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /entra {
        if ($ammesso = 1) { return 302 /; }
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        try_files /entra.html =404;
    }

    location = /entra/verifica {
        limit_req zone=entra burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @troppi;
        client_max_body_size 2k;
        client_body_buffer_size 2k;
        client_body_in_single_buffer on;
        js_content gate.entra;
    }

    location @troppi {
        return 303 /entra?troppi;
    }

    # lo sfondo della pagina di accesso deve vedersi prima della parola
    location ~ ^/img/scena-4(-1200)?\.webp$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location /font/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location / {
        if ($ammesso != 1) { return 302 /entra; }
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "private, no-store" always;
        try_files $uri $uri/ =404;
    }
}
