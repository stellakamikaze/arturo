# Il gate di Arturo su Linux, Mac e Windows (revisione del 22/11/2026, A1 e D4, #6419).
# Fino al 22/11/2026 il gate girava solo sul Mac di chi rilascia, e rossi visti solo su Windows sono usciti
# in rilasci firmati. Qui gira tests/verifica-allineamento.sh sui tre sistemi, solo nel repository pubblico:
#   - a ogni push su dev, --toccati: solo i lavori con una fonte fra i file cambiati dal push prima
#     (ARTURO_GATE_BASE). Un push senza "prima" (ramo nuovo, storia riscritta) fa il giro completo;
#   - a ogni tag di rilascio v*, e a mano (Actions, "Run workflow"), --rilascio: il giro completo, diviso in
#     4 parti per sistema (24/11/2026: Windows 109 minuti, Mac 93 su un computer solo). Ogni parte fa i suoi
#     lavori (tests/esegui_gate.py --parte, pesi in tests/gate-pesi.json); server, shell, js e audit la parte 1.
#     Il push su dev resta in una parte: i lavori toccati sono pochi.
# Il nome della run dice il modo. scripts/firma-rilascio-arturo.sh della config di chi rilascia cerca una run
# "gate rilascio" verde sul commit prima di firmare (docs/manutenzione.md). Niente segreti, permessi in sola
# lettura, azioni fissate a un commit.
name: gate
run-name: >-
  ${{ (github.event_name == 'push' && github.ref_type == 'branch') && 'gate toccati' || 'gate rilascio' }}
  ${{ github.sha }}

on:
  push:
    branches: [dev]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

jobs:
  gate:
    if: github.repository == 'stellakamikaze/arturo'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        parte: ${{ fromJSON((github.event_name == 'push' && github.ref_type == 'branch') && '["1/1"]' || '["1/4","2/4","3/4","4/4"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      # Su Windows il checkout convertirebbe gli a capo in CRLF, e bash non legge più gli script.
      - name: Git senza conversione degli a capo
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.longpaths true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Python 3.8 è il minimo dichiarato (PY38_BANCHI) e fa anche da Python vecchio per U04. PyYAML per i banchi,
      # Claude Code per il pannello (claude plugin validate, claude plugin test, claude -p).
      - name: Strumenti del gate
        run: |
          uv python install 3.8
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          python -m pip install --disable-pip-version-check pyyaml
          npm install -g @anthropic-ai/claude-code
          if ! command -v python3 >/dev/null 2>&1; then
            cp "$(command -v python)" "$(dirname "$(command -v python)")/python3.exe"
          fi
      - name: Modo del gate
        env:
          EVENTO: ${{ github.event_name }}
          TIPO: ${{ github.ref_type }}
          PRIMA: ${{ github.event.before }}
        run: |
          if [ "$EVENTO" = push ] && [ "$TIPO" = branch ] && git cat-file -e "${PRIMA}^{commit}" 2>/dev/null; then
            echo "ARTURO_GATE_BASE=$PRIMA" >> "$GITHUB_ENV"
            echo "MODO=--toccati" >> "$GITHUB_ENV"
          else
            echo "MODO=--rilascio" >> "$GITHUB_ENV"
          fi
      - name: Gate
        env:
          ARTURO_GATE_PARTE: ${{ matrix.parte }}
        run: |
          python3 --version; python3.8 --version || true; node --version; claude --version
          bash tests/verifica-allineamento.sh "$MODO"
