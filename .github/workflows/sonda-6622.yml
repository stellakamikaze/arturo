# Sonda temporanea #6622: T08 di test_todo.py su Windows, con lo stderr delle scritture che cadono.
# Solo sul ramo sonda-6622, da togliere a diagnosi chiusa.
name: sonda-6622
on:
  push:
    branches: [sonda-6622]
permissions:
  contents: read
jobs:
  sonda:
    if: github.repository == 'stellakamikaze/arturo'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Git senza conversione degli a capo
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Python 3.8
        run: uv python install 3.8
      - name: Sonda, due giri py38 insieme come nel gate (worker=2) e uno py312
        run: |
          PY38="$(uv python find 3.8)"
          "$PY38" .github/sonda-6622/sonda.py . 30 py38-a > a.log 2>&1 &
          "$PY38" .github/sonda-6622/sonda.py . 30 py38-b > b.log 2>&1 &
          python .github/sonda-6622/sonda.py . 30 py312 > c.log 2>&1 &
          wait
          cat a.log b.log c.log
          echo "=== SINTESI"
          grep -h -A2 "RIEPILOGO\|CADUTA\|REGISTRO" a.log b.log c.log || true
