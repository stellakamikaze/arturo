<!doctype html>
<!-- Anteprima del repository su GitHub (Settings > Social preview), 1280x640. Colori, font, marchio e
     reticolo vengono dalla landing (sito/stile/colori.css, sito/font/, sito/img/volta.svg, DESIGN.md).
     Si rifà con: chrome --headless=new --window-size=1280,640 --screenshot=../sito/img/anteprima-github.png strumenti/anteprima-github.html -->
<html lang="it"><head><meta charset="utf-8"><title>Arturo, anteprima</title>
<style>
@font-face{font-family:Archivo;src:url(../sito/font/archivo.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:"Atkinson Next";src:url(../sito/font/atkinson-next.woff2) format("woff2");font-weight:200 800}
:root{--cielo:#d7ebff;--inchiostro:#0b0d10;--grafite:#2a2e35;--cenere:#59606a;--stella:#f2a24a}
html,body{margin:0;width:1280px;height:640px;overflow:hidden;background:var(--cielo)}
.tela{position:relative;width:1280px;height:640px}
.volta{position:absolute;left:-449px;top:-499px;width:1840px;height:1150px}
.barra{position:absolute;top:0;left:0;right:0;height:10px;background:var(--stella)}
.testo{position:absolute;left:84px;right:84px;top:70px;bottom:104px;display:flex;flex-direction:column}
.marchio{display:flex;align-items:center;gap:14px;font:500 34px/1 Archivo,sans-serif;font-stretch:108%;color:var(--inchiostro)}
.marchio svg{width:40px;height:40px;color:var(--inchiostro)}
.nome{margin:auto 0 0;font:250 200px/.86 Archivo,sans-serif;font-stretch:118%;letter-spacing:.01em;color:var(--inchiostro)}
.promessa{margin:34px 0 0;font:300 40px/1.2 Archivo,sans-serif;font-stretch:104%;color:var(--inchiostro)}
.promessa span{display:block;color:var(--cenere)}
.piede{position:absolute;left:84px;bottom:52px;font:600 19px/1 Archivo,sans-serif;font-stretch:75%;letter-spacing:.12em;text-transform:uppercase;color:var(--grafite)}
</style></head><body><div class="tela">
<img class="volta" src="../sito/img/volta.svg" alt="">
<div class="barra"></div>
<div class="testo">
  <div class="marchio"><svg viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M3 24 11.5 9.5 17 17l8-11" stroke="currentColor" stroke-width="1.5"/><circle cx="11.5" cy="9.5" r="3.2" fill="#f2a24a"/><circle cx="17" cy="17" r="1.6" fill="currentColor"/><circle cx="25" cy="6" r="1.6" fill="currentColor"/></svg>Claude Code in italiano</div>
  <h1 class="nome">ARTURO</h1>
  <p class="promessa">L'IA che usi in chat, al lavoro nelle tue cartelle.<span>Prima di fare danni, chiede a te.</span></p>
</div>
<div class="piede">Open source, MIT · arturo.stellakamikaze.org</div>
</div></body></html>
