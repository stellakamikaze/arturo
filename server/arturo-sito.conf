# Landing di Arturo, pubblica dal 16/10/2026 (#3478, decisione di Federico: «togli l'accesso via
# parola d'ordine»). /admin/ resta dietro Cloudflare Access. Il gate njs non è più incluso: gate.js e
# segreti/gate.conf restano su disco fino al cestino del 28/10 (#3282).

# Plausible conta le visite: senza l'IP vero, dietro il tunnel tutti sarebbero un visitatore solo.
map $http_cf_connecting_ip $ip_vero {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# Un limite per visitatore sui moduli (review di sicurezza del 16/10/2026): il Worker vede tutto il
# traffico della landing con un IP solo, quello di casa, e il limite per persona può farlo solo nginx.
limit_req_zone $ip_vero zone=feedback:1m rate=6r/m;
limit_req_zone $ip_vero zone=download:1m rate=30r/m;
limit_req_status 429;

# Gli header di ogni risposta stanno in intestazioni.inc. La CSP ammette: script e stili della pagina
# (niente script inline né CDN: su questa origine chi passa da Access ha i poteri dell'admin), il modulo e
# gli articoli di Ghost (stellakamikaze.org). Gli stili inline restano. Niente blob: dal 25/10/2026: il vocale non c'è più.
server {
    listen      80;
    listen      [::]:80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;
    absolute_redirect off;   # dietro il tunnel lo schema giusto è https: redirect relativi
    resolver    127.0.0.11 valid=300s ipv6=off;

    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://stellakamikaze.org; font-src 'self' data:; connect-src 'self' https://stellakamikaze.org; frame-src https://stellakamikaze.org; media-src 'self'; form-action 'self' https://stellakamikaze.org; base-uri 'self'; frame-ancestors 'none'";

    include /etc/nginx/conf.d/intestazioni.inc;

    # La parola d'ordine non c'è più: i vecchi link portano alla home.
    location = /entra          { return 301 /; }
    location = /entra/verifica { return 301 /; }
    location = /entra.html     { return 301 /; }

    # L'indirizzo interno di Plausible sta fuori dal repository: set $plausible http://<host>:<porta>;
    include /etc/nginx/segreti/plausible.conf;

    # Plausible, servito da qui: lo script e gli eventi passano dal dominio della landing,
    # così non li fermano i blocchi delle pubblicità. Nomi neutri, come su stellakamikaze.org.
    location = /js/a.js {
        proxy_pass $plausible/js/script.js;
        proxy_set_header Host analytics.stellakamikaze.org;
        proxy_set_header X-Forwarded-For $ip_vero;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        include /etc/nginx/conf.d/intestazioni.inc;
    }

    location = /api/e {
        proxy_pass $plausible/api/event;
        proxy_set_header Host analytics.stellakamikaze.org;
        proxy_set_header X-Forwarded-For $ip_vero;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header User-Agent $http_user_agent;
        client_max_body_size 4k;
    }

    # Il modulo di feedback e i download vanno al server di Arturo (il Worker). Niente IP verso il
    # Worker: non lo salva e non gli serve. Solo messaggi scritti dal 25/10/2026: 4000 caratteri ed email stanno
    # larghi in 64 KB, lo stesso tetto del Worker.
    location = /api/feedback {
        limit_except POST { deny all; }
        limit_req zone=feedback burst=3 nodelay;
        set $dati https://arturo-dati.stellakamikaze.org;
        proxy_pass $dati/v1/feedback;
        proxy_ssl_server_name on;
        proxy_set_header Host arturo-dati.stellakamikaze.org;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Cookie "";
        client_max_body_size 64k;
        proxy_read_timeout 30s;
    }

    location = /api/sito {
        limit_except POST { deny all; }
        limit_req zone=download burst=10 nodelay;
        set $dati https://arturo-dati.stellakamikaze.org;
        proxy_pass $dati/v1/sito;
        proxy_ssl_server_name on;
        proxy_set_header Host arturo-dati.stellakamikaze.org;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Cookie "";
        client_max_body_size 4k;
    }

    location /stile/ {
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/conf.d/intestazioni.inc;
        try_files $uri =404;
    }

    location /font/ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        include /etc/nginx/conf.d/intestazioni.inc;
        try_files $uri =404;
    }

    location /img/ {
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/conf.d/intestazioni.inc;
        try_files $uri =404;
    }

    # /admin: la pagina privata dei progetti. La protegge Cloudflare Access;
    # il server dietro verifica da sé il JWT di Access, perché dal tailnet si arriva qui senza Cloudflare.
    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000" always;   # la CSP la mette l'admin
        set $admin http://arturo-admin:8080;
        proxy_pass $admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
        client_max_body_size 256k;
    }

    location / {
        include /etc/nginx/conf.d/intestazioni.inc;
        # no-transform: Cloudflare non inietta lo script anti-bot (JavaScript Detections, sul
        # piano Free non si spegne) che la CSP bloccava. Toglie anche la compressione dell'edge,
        # quindi comprime nginx: Cloudflare passa la risposta gzip così com'è.
        add_header Cache-Control "public, max-age=300, must-revalidate, no-transform" always;
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_types text/css application/javascript text/javascript application/json application/xml application/manifest+json image/svg+xml text/plain;
        try_files $uri $uri/ =404;
    }
}
