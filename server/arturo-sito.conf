# Landing di Arturo dietro parola d'ordine.
# /entra, /font/, /stile/ e le due rotte di Plausible sono pubblici, tutto il resto chiede il cookie firmato.
js_path   /etc/nginx/njs/;
js_import gate from gate.js;
include   /etc/nginx/segreti/gate.conf;   # js_var $gate_hash ...; js_var $gate_chiave ...;
js_set    $ammesso gate.ammesso;

# Dietro il tunnel l'indirizzo vero sta in CF-Connecting-IP.
map $http_cf_connecting_ip $chi_tenta {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $chi_tenta zone=entra:1m rate=10r/m;

# Plausible conta le visite: senza l'IP vero, dietro il tunnel tutti sarebbero un visitatore solo.
map $http_cf_connecting_ip $ip_vero {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen      80;
    listen      [::]:80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;
    absolute_redirect off;   # dietro il tunnel lo schema giusto è https: redirect relativi

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /entra {
        if ($ammesso = 1) { return 302 /; }
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        try_files /entra.html =404;
    }

    location = /entra/verifica {
        limit_req zone=entra burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @troppi;
        client_max_body_size 2k;
        client_body_buffer_size 2k;
        client_body_in_single_buffer on;
        js_content gate.entra;
    }

    location @troppi {
        return 303 /entra?troppi;
    }

    # L'indirizzo interno di Plausible sta fuori dal repository: set $plausible http://<host>:<porta>;
    include /etc/nginx/segreti/plausible.conf;

    # Plausible, servito da qui: lo script e gli eventi passano dal dominio della landing,
    # così non li fermano i blocchi delle pubblicità. Nomi neutri, come su stellakamikaze.org.
    location = /js/a.js {
        proxy_pass $plausible/js/script.js;
        proxy_set_header Host analytics.stellakamikaze.org;
        proxy_set_header X-Forwarded-For $ip_vero;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
    }

    location = /api/e {
        proxy_pass $plausible/api/event;
        proxy_set_header Host analytics.stellakamikaze.org;
        proxy_set_header X-Forwarded-For $ip_vero;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header User-Agent $http_user_agent;
        client_max_body_size 4k;
    }

    # i colori comuni servono anche a /entra, prima della parola d'ordine
    location /stile/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location /font/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # /admin: la pagina privata dei progetti. La protegge Cloudflare Access, non la parola d'ordine;
    # il server dietro verifica da sé il JWT di Access, perché dal tailnet si arriva qui senza Cloudflare.
    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $admin http://arturo-admin:8080;
        proxy_pass $admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
        client_max_body_size 256k;
    }

    location / {
        if ($ammesso != 1) { return 302 /entra; }
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "private, no-store" always;
        try_files $uri $uri/ =404;
    }
}
