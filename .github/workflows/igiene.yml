# Igiene del repository pubblico (I03, #3505): su ogni push, su ogni branch e su ogni pull request (quelle da
# un fork non hanno un push qui), solo nel repository pubblico
# di Arturo (il job ha un `if`), controlla che nei file, nei
# percorsi e nei messaggi dei commit arrivati non ci siano i nomi della config privata dell'autore.
# Lancia solo tests/igiene.py: niente segreti, niente rete oltre al checkout, permessi in sola lettura.
name: igiene

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  igiene:
    # Solo sul repository pubblico. /aggiorna porta questo file anche nella copia privata di ~/.claude
    # di chi usa Arturo, dove i nomi sono i suoi e il controllo dava falsi rossi a ogni push (segnalazione n. 4, 19/10/2026).
    if: github.repository == 'stellakamikaze/arturo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Nomi della config privata
        env:
          PRIMA: ${{ github.event.before || github.event.pull_request.base.sha }}
          DOPO: ${{ github.event.pull_request.head.sha || github.sha }}
          RAMO: ${{ github.ref_name }}
        run: |
          # Un branch nuovo, o riscritto da un rebase, non ha un "prima": si controllano i commit che dev
          # non ha. Prima si controllava tutta la storia, e i nomi nei messaggi dei commit vecchi, già su
          # dev, davano rosso a ogni branch nuovo (gate-snello e pm-monitor, 3/11/2026).
          if git cat-file -e "${PRIMA}^{commit}" 2>/dev/null; then
            INTERVALLO="${PRIMA}..${DOPO}"
          elif BASE=$(git merge-base "$DOPO" origin/dev 2>/dev/null); then
            INTERVALLO="${BASE}..${DOPO}"
          else
            INTERVALLO="${DOPO}"
          fi
          # Fuori da dev i commit che dev ha già si sono controllati quando sono arrivati su dev: ricontrollarli
          # mandava la stessa email due o tre volte, da main e da ogni ramo che unisce dev (10/11/2026).
          if [ "$RAMO" != "dev" ] && git rev-parse -q --verify origin/dev >/dev/null; then
            INTERVALLO="${INTERVALLO} ^origin/dev"
          fi
          python3 tests/igiene.py --repo . --intervallo "$INTERVALLO"
