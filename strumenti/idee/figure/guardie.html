<figure class="figura figura--diagramma figura--guardie">
<div class="figura__piastra">
<p class="figura__testa" aria-hidden="true"><span>Fig. 2</span><span>Il percorso di un comando</span></p>
<svg class="fd-svg fd-svg--guardie" viewBox="0 0 400 672" role="img" aria-labelledby="fd-guardie-t fd-guardie-d"><title id="fd-guardie-t">Il percorso di un comando nelle guardie</title><desc id="fd-guardie-d">Claude propone un comando e la guardia lo legge prima che parta. Tre esiti: passa, e decidono i permessi normali; chiede a te, per un gesto che non si annulla; ferma, per un danno certo come cancellare il disco intero. Se la guardia si rompe chiede a te; se il comando è vuoto o illeggibile la guardia tace e decidono i permessi.</desc><defs><marker id="fd-g-f" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path class="fd-punta" d="M0 0 8 3 0 6z"/></marker></defs><path class="fd-linea" d="M200 80V111" marker-end="url(#fd-g-f)"/><path class="fd-linea" d="M32 184V448q0 8 8 8H55" marker-end="url(#fd-g-f)"/><path class="fd-linea" d="M32 256H55" marker-end="url(#fd-g-f)"/><path class="fd-linea" d="M32 356H55" marker-end="url(#fd-g-f)"/><path class="fd-linea fd-linea--quieta" d="M352 556H356q8 0 8-8V364q0-8-8-8H353" marker-end="url(#fd-g-f)"/><path class="fd-linea fd-linea--quieta" d="M352 628H372q8 0 8-8V264q0-8-8-8H353" marker-end="url(#fd-g-f)"/><rect class="fd-box " x="16" y="16" width="368" height="64" rx="2"/><text class="fd-nome" x="32" y="42">Claude propone un comando</text><text class="fd-riga" x="32" y="64">Per esempio <tspan class="fd-mono">rm -r bozze/</tspan></text><rect class="fd-box fd-box--guardia" x="16" y="112" width="368" height="72" rx="2"/><text class="fd-nome fd-nome--chiaro" x="32" y="138">La guardia lo legge</text><text class="fd-riga fd-riga--chiara" x="32" y="158">Un solo smistatore chiama le guardie che<tspan x="32" dy="16">servono, prima che il comando parta.</tspan></text><circle class="fd-punto" cx="32" cy="256" r="3"/><circle class="fd-punto" cx="32" cy="356" r="3"/><rect class="fd-box fd-box--passa" x="56" y="216" width="296" height="80" rx="2"/><path class="fd-segno fd-segno--passa" d="M326 238l4 4 8-9"/><text class="fd-nome" x="72" y="244">Passa</text><text class="fd-riga" x="72" y="266">Nessuna guardia ha da ridire: decidono<tspan x="72" dy="16">i permessi normali. Succede quasi sempre.</tspan></text><rect class="fd-box fd-box--chiede" x="56" y="316" width="296" height="80" rx="2"/><path class="fd-segno fd-segno--chiede" d="M328 334a4 4 0 1 1 5 4c-1 .5-1 1.5-1 2.5"/><circle class="fd-chiede" cx="332" cy="344" r="1.3"/><text class="fd-nome" x="72" y="344">Chiede a te</text><text class="fd-riga" x="72" y="366">Un gesto che non si annulla, come<tspan x="72" dy="16">cancellare una cartella: parte col tuo sì.</tspan></text><rect class="fd-box fd-box--blocca" x="56" y="416" width="296" height="80" rx="2"/><path class="fd-segno fd-segno--blocca" d="M327 433l10 10m0-10-10 10"/><text class="fd-nome" x="72" y="444">Ferma</text><text class="fd-riga" x="72" y="466">Un danno certo, come cancellare il disco<tspan x="72" dy="16">intero: il comando non parte.</tspan></text><text class="fd-etichetta" x="56" y="516">Se qualcosa non torna</text><rect class="fd-box fd-box--quieta" x="56" y="528" width="296" height="56" rx="2"/><text class="fd-nome" x="72" y="552">La guardia si rompe</text><text class="fd-riga" x="72" y="572">Senza una risposta valida, chiede a te.</text><rect class="fd-box fd-box--quieta" x="56" y="600" width="296" height="56" rx="2"/><text class="fd-nome" x="72" y="624">Comando vuoto o illeggibile</text><text class="fd-riga" x="72" y="644">La guardia tace, decidono i permessi.</text></svg>
</div>
<figcaption><p>Le guardie leggono ogni comando prima che parta. Quando chiede, ferma o si rompe, una guardia lascia il suo nome nella telemetria, mai il comando.</p></figcaption>
</figure>
