# Il server di Arturo. Per chi fa un fork: sostituisci i segnaposto, poi
#   npx wrangler d1 create arturo         (copia il database_id qui sotto)
#   npx wrangler d1 execute arturo --remote --file schema.sql
#   npx wrangler deploy
#   npx wrangler secret put RIEPILOGO_TOKEN   (almeno 32 caratteri: senza, /v1/riepilogo risponde 401)
# Il destinatario deve essere un indirizzo verificato in Email Routing del tuo dominio.
name = "arturo-telemetria"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = false

routes = [{ pattern = "DOMINIO_DEL_SERVER", custom_domain = true }]

[triggers]
crons = ["0 6 * * *"]   # ogni mattina alle 8 (ora italiana estiva): recap del giorno prima se non è vuoto; il lunedì sempre riepilogo e pulizia

[[d1_databases]]
binding = "DB"
database_name = "arturo"
database_id = "ID_DEL_DATABASE"

[[send_email]]
name = "POSTA"
destination_address = "DESTINATARIO_VERIFICATO"

# Il limite per IP (Rate Limiting dei Workers): gli eventi delle installazioni e i moduli pubblici
# (feedback, download, segnalazioni). namespace_id è un numero scelto da te, unico nell'account.
[[ratelimits]]
name = "LIMITE_EVENTI"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "LIMITE_MODULI"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[vars]
MITTENTE = "MITTENTE_SUL_TUO_DOMINIO"
DESTINATARIO = "DESTINATARIO_VERIFICATO"
